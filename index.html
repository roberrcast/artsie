<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- description -->
        <meta
            name="description"
            content="Explora una colección virtual de obras de arte. Una aplicación web front-end que integra una API REST para buscar, filtrar y descubrir arte atemporal."
        />

        <!-- keywords -->
        <meta
            name="keywords"
            content="galería de arte virtual, web app, ingeniero front-end, desarrollo web, portafolio, proyecto escolar, API REST, responsive design, JavaScript, front end"
        />

        <!-- open graph -->
        <meta property="og:title" content="The Open Gallery" />
        <meta
            property="og:description"
            content="Explora una colección virtual de obras de arte. Una aplicación web front-end que integra una API REST para buscar, filtrar y descubrir arte atemporal."
        />
        <meta
            property="og:image"
            content="https://theopengallery.netlify.app/graph-image.webp"
        />

        <!-- title -->
        <title>The Open Gallery</title>

        <!-- preconnect fonts, favicons and material icons -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/favicon-16x16.png"
        />

        <link rel="shortcut icon" href="/favicon.ico" />

        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png"
        />

        <link rel="manifest" href="/site.webmanifest" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
